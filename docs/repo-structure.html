<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devtools repo · Structure</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · devtools.badhrinadh.com</p>
    <h1>How the devtools repo fits together</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1000 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-structure-title repo-structure-desc">
      <title id="repo-structure-title">Devtools repo structure</title>
      <desc id="repo-structure-desc">Tool documents, layouts and config, and JavaScript modules in the repo feed a Jekyll build on Cloudflare, whose output a Worker serves to a browser that loads each tool's module and the shared library.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Repo -->
        <rect x="24" y="32" width="192" height="312" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="102" y="36" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="45" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">REPO</text>

        <!-- Zone: Cloudflare -->
        <rect x="256" y="132" width="400" height="112" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="424" y="136" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE</text>

        <!-- Zone: Browser -->
        <rect x="712" y="132" width="264" height="312" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="818" y="136" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="844" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

        <!-- Arrows first (behind boxes) -->
        <!-- Three repo inputs fan into Jekyll's left edge at 16 / 32 / 48 -->
        <path d="M 200,96 H 228 Q 236,96 236,104 V 172 Q 236,180 244,180 H 272"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="200" y1="196" x2="272" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 200,296 H 228 Q 236,296 236,288 V 220 Q 236,212 244,212 H 272"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Jekyll -> Worker -->
        <line x1="424" y1="196" x2="496" y2="196" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Worker -> tool page -->
        <line x1="640" y1="196" x2="728" y2="196" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Browser chain -->
        <line x1="844" y1="228" x2="844" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="844" y1="328" x2="844" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="432" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="185" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY</text>

        <rect x="660" y="176" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="684" y="185" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="852" y="240" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="876" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOADS</text>

        <rect x="852" y="340" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="884" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMPORTS</text>

        <!-- Node: Tool documents (store) -->
        <rect x="40" y="64" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="62" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOC</text>
        <text x="120" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool documents</text>
        <text x="120" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_tools/&lt;slug&gt;.html</text>

        <!-- Node: Layouts and config (store) -->
        <rect x="40" y="164" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="164" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="172" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="66" y="181" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHELL</text>
        <text x="120" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layouts &amp; config</text>
        <text x="120" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_layouts/ · _config.yml</text>

        <!-- Node: Behaviour (store) -->
        <rect x="40" y="264" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="264" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="48" y="272" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="60" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JS</text>
        <text x="120" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Behaviour</text>
        <text x="120" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">assets/js/ · tools + lib</text>

        <!-- Node: Jekyll build (focal) -->
        <rect x="272" y="164" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="164" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="280" y="172" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="298" y="181" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
        <text x="348" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jekyll build</text>
        <text x="348" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ _site/ (static)</text>

        <!-- Node: Cloudflare Worker (cloud) -->
        <rect x="496" y="164" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="164" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="504" y="172" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="520" y="181" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="568" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
        <text x="568" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">assets-only · no script</text>

        <!-- Node: Tool page -->
        <rect x="728" y="164" width="232" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="164" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="736" y="172" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="752" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTML</text>
        <text x="844" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool page</text>
        <text x="844" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool layout + tool markup</text>

        <!-- Node: Tool module -->
        <rect x="728" y="264" width="232" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="264" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="736" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="750" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESM</text>
        <text x="844" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tool module</text>
        <text x="844" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">assets/js/tools/&lt;slug&gt;.js</text>

        <!-- Node: Shared lib -->
        <rect x="728" y="364" width="232" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="364" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="736" y="372" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="750" y="381" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="844" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared lib</text>
        <text x="844" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui.js · codecs · workers</text>

        <!-- Legend strip -->
        <line x1="40" y1="468" x2="960" y2="468" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="500" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / build</text>

        <rect x="164" y="500" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="184" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">File in repo</text>

        <rect x="276" y="500" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="296" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cloud</text>

        <rect x="364" y="500" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runs in the browser</text>

        <line x1="528" y1="506" x2="556" y2="506" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="564" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="664" y1="506" x2="692" y2="506" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="700" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Deploy</text>

        <line x1="764" y1="506" x2="792" y2="506" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="800" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Feeds / loads</text>
      </svg>
    </div>
  </div>
</body>
</html>
