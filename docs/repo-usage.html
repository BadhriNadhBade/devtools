<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devtools repo · Usage</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · devtools.badhrinadh.com</p>
    <h1>From clone to live</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1000 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repo-usage-title repo-usage-desc">
      <title id="repo-usage-title">Devtools repo usage</title>
      <desc id="repo-usage-desc">Flowchart of working in the devtools repo: run it locally, add a tool, check the build, loop back on failure, then push to main so Cloudflare deploys it.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Callout leaders (behind everything) -->
        <path d="M 104,284 Q 100,240 104,192" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 464,84 L 464,110" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="150" x2="204" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="364" y1="150" x2="400" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="528" y1="150" x2="568" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="664" y1="150" x2="704" y2="150" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="816" y1="150" x2="852" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- No: dashed return into Add a tool -->
        <path d="M 616,198 V 242 Q 616,250 608,250 H 292 Q 284,250 284,242 V 186"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="668" y="130" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="684" y="139" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="624" y="212" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="636" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start oval: Run locally -->
        <rect x="40" y="114" width="128" height="72" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="104" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run locally</text>
        <text x="104" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">./start</text>
        <text x="104" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker compose up</text>

        <!-- Step: Add a tool -->
        <rect x="204" y="114" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add a tool</text>
        <text x="284" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_tools/&lt;slug&gt;.html</text>
        <text x="284" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">assets/js/tools/&lt;slug&gt;.js</text>

        <!-- Step: Check the build -->
        <rect x="400" y="114" width="128" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="464" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check the build</text>
        <text x="464" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">docker build</text>
        <text x="464" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--target build .</text>

        <!-- Decision: Build passes? (coral focal) -->
        <polygon points="616,102 664,150 616,198 568,150" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="616" y="147" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build</text>
        <text x="616" y="161" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">passes?</text>

        <!-- Step: Push to main -->
        <rect x="704" y="114" width="112" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Push to main</text>
        <text x="760" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git push</text>
        <text x="760" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Workers Builds</text>

        <!-- End oval: Live -->
        <rect x="852" y="114" width="104" height="72" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="904" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live</text>
        <text x="904" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">devtools.</text>
        <text x="904" y="171" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">badhrinadh.com</text>

        <!-- Callouts -->
        <circle cx="104" cy="190" r="2" fill="#2d3142"/>
        <text x="40" y="300" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">the dev server skips _headers, so the CSP is not in force here</text>

        <circle cx="464" cy="112" r="2" fill="#2d3142"/>
        <text x="464" y="76" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Cloudflare runs this same build, with no second chance</text>

        <!-- Legend strip -->
        <line x1="40" y1="328" x2="960" y2="328" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="360" width="22" height="10" rx="5" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="68" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="164" y="360" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="260,365 267,359 274,365 267,371" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="282" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate (decision)</text>

        <line x1="400" y1="366" x2="428" y2="366" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="436" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>

        <line x1="528" y1="366" x2="556" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="564" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Next step</text>

        <line x1="648" y1="366" x2="676" y2="366" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="684" y="368" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retry loop</text>
      </svg>
    </div>
  </div>
</body>
</html>
